name: lumbung

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      LOG_LEVEL: INFO
      ARTIFACT_DIR: /app/artifacts
      SAMPLE_PATH: /app/data/sample_store_snapshot.csv
    ports:
      - "8000:8000"
    networks:
      - lumbung

  frontend:
    build:
      context: frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    networks:
      - lumbung

networks:
  lumbung:
    driver: bridge
